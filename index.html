<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>yt-dlp WebUI</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1e1e2e; color: #cdd6f4; min-height: 100vh; }
        
        .container { max-width: 900px; margin: 0 auto; padding: 16px; }
        
        h1 { text-align: center; margin-bottom: 20px; color: #f38ba8; font-size: 1.5rem; }
        
        .tabs { display: flex; gap: 4px; margin-bottom: 16px; background: #313244; border-radius: 8px; padding: 4px; }
        .tab { flex: 1; padding: 10px 16px; background: transparent; border: none; border-radius: 6px; color: #a6adc8; cursor: pointer; font-size: 14px; font-weight: 500; transition: 0.2s; }
        .tab:hover { color: #cdd6f4; }
        .tab.active { background: #45475a; color: #f5e0dc; }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        .card { background: #313244; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
        
        .input-group { margin-bottom: 12px; }
        .input-group label { display: block; margin-bottom: 6px; color: #bac2de; font-size: 13px; }
        
        input[type="text"], input[type="number"], select, textarea {
            width: 100%; padding: 10px 12px; border: 1px solid #45475a; border-radius: 6px; 
            background: #181825; color: #cdd6f4; font-size: 14px; transition: border-color 0.2s;
        }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #cba6f7; }
        
        .url-row { display: flex; gap: 8px; }
        .url-row input { flex: 1; }
        
        .btn { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 500; transition: 0.2s; display: inline-flex; align-items: center; gap: 6px; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-primary { background: #cba6f7; color: #1e1e2e; }
        .btn-primary:hover:not(:disabled) { background: #d8b4fe; }
        .btn-success { background: #a6e3a1; color: #1e1e2e; }
        .btn-success:hover:not(:disabled) { background: #b4e3b4; }
        .btn-danger { background: #f38ba8; color: #1e1e2e; }
        .btn-danger:hover:not(:disabled) { background: #f5a0b5; }
        .btn-secondary { background: #45475a; color: #cdd6f4; }
        .btn-secondary:hover:not(:disabled) { background: #585b70; }
        
        .video-preview { display: flex; gap: 16px; margin-bottom: 16px; }
        .thumbnail-container { flex-shrink: 0; }
        .thumbnail { width: 200px; height: 150px; object-fit: cover; border-radius: 8px; background: #181825; }
        .thumbnail-placeholder { width: 200px; height: 150px; display: flex; align-items: center; justify-content: center; background: #181825; border-radius: 8px; color: #6c7086; }
        .video-info { flex: 1; min-width: 0; }
        .video-title { font-weight: 600; margin-bottom: 8px; color: #f5e0dc; word-break: break-word; }
        .video-desc { font-size: 13px; color: #6c7086; max-height: 100px; overflow-y: auto; word-break: break-word; }
        .video-meta { display: flex; gap: 12px; margin-top: 8px; font-size: 12px; color: #6c7086; }
        
        .duration-badge { position: absolute; bottom: 8px; right: 8px; background: rgba(0,0,0,0.8); color: white; padding: 2px 6px; border-radius: 4px; font-size: 12px; }
        .live-badge { position: absolute; top: 8px; left: 8px; background: #f38ba8; color: white; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
        .thumbnail-wrap { position: relative; display: inline-block; }
        
        .format-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
        .format-group { background: #181825; padding: 12px; border-radius: 8px; }
        .format-group h4 { margin-bottom: 8px; color: #bac2de; font-size: 13px; }
        .format-group select { margin-bottom: 8px; }
        .format-info { font-size: 12px; color: #6c7086; }
        
        .checkbox-group { display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 12px; }
        .checkbox-item { display: flex; align-items: center; gap: 6px; font-size: 13px; }
        .checkbox-item input[type="checkbox"] { width: auto; }
        
        .download-bar { display: flex; align-items: center; gap: 12px; margin-top: 16px; padding-top: 16px; border-top: 1px solid #45475a; }
        .download-bar input { flex: 1; }
        
        .progress-container { margin-top: 16px; display: none; }
        .progress-container.active { display: block; }
        .progress-bar { height: 6px; background: #181825; border-radius: 3px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #cba6f7, #f5c2e7); transition: width 0.3s; }
        .progress-text { display: flex; justify-content: space-between; margin-top: 8px; font-size: 12px; color: #6c7086; }
        
        .downloads-list { margin-top: 16px; }
        .download-item { background: #181825; padding: 12px; border-radius: 8px; margin-bottom: 8px; display: flex; align-items: center; gap: 12px; }
        .download-item.completed { border-left: 3px solid #a6e3a1; }
        .download-item.failed { border-left: 3px solid #f38ba8; }
        .download-item.downloading { border-left: 3px solid #89b4fa; }
        .download-info { flex: 1; min-width: 0; }
        .download-title { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .download-status { font-size: 12px; color: #6c7086; }
        
        .files-list { margin-top: 12px; }
        .file-item { background: #181825; padding: 12px; border-radius: 8px; margin-bottom: 8px; display: flex; align-items: center; gap: 12px; }
        .file-item .name { flex: 1; word-break: break-all; }
        .file-item .size { color: #6c7086; font-size: 12px; }
        
        .advanced-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .advanced-section { background: #181825; padding: 12px; border-radius: 8px; }
        .advanced-section h4 { margin-bottom: 12px; color: #bac2de; font-size: 13px; border-bottom: 1px solid #45475a; padding-bottom: 8px; }
        
        .hidden { display: none !important; }
        
        .spinner { width: 14px; height: 14px; border: 2px solid #6c7086; border-top-color: #cba6f7; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .status-badge { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: 500; }
        .status-queued { background: #f9e2af; color: #1e1e2e; }
        .status-downloading { background: #89b4fa; color: #1e1e2e; }
        .status-completed { background: #a6e3a1; color: #1e1e2e; }
        .status-failed { background: #f38ba8; color: #1e1e2e; }
        .status-cancelled { background: #6c7086; color: #1e1e2e; }
    </style>
</head>
<body>
    <div class="container">
        <h1>yt-dlp WebUI</h1>
        
        <div class="tabs">
            <button class="tab active" data-tab="main">Main</button>
            <button class="tab" data-tab="advanced">Advanced</button>
            <button class="tab" data-tab="downloads">Downloads</button>
            <button class="tab" data-tab="files">Files</button>
        </div>
        
        <div id="main-tab" class="tab-content active">
            <div class="card">
                <div class="input-group">
                    <label>URL</label>
                    <div class="url-row">
                        <input type="text" id="url-input" placeholder="Enter video URL..." style="flex: 1;" />
                        <button class="btn btn-primary" id="analyze-btn" onclick="analyzeUrl()">Analyze</button>
                    </div>
                </div>
            </div>
            
            <div class="card hidden" id="video-preview-card">
                <div class="video-preview">
                    <div class="thumbnail-container">
                        <div class="thumbnail-wrap">
                            <div class="thumbnail-placeholder hidden" id="thumbnail-placeholder">
                                <span>No Thumbnail</span>
                            </div>
                            <img class="thumbnail hidden" id="video-thumbnail" src="" alt="Thumbnail" />
                            <span class="duration-badge hidden" id="video-duration"></span>
                            <span class="live-badge hidden" id="live-badge">LIVE</span>
                        </div>
                        <label class="checkbox-item" style="margin-top: 8px;">
                            <input type="checkbox" id="download-thumb" />
                            <span>Download Thumbnail</span>
                        </label>
                    </div>
                    <div class="video-info">
                        <div class="video-title" id="video-title">Video Title</div>
                        <div class="video-desc" id="video-desc"></div>
                        <div class="video-meta">
                            <span id="video-views"></span>
                            <span id="video-channel"></span>
                        </div>
                    </div>
                </div>
                
                <div class="format-grid">
                    <div class="format-group">
                        <h4>Video Format</h4>
                        <select id="video-format"></select>
                        <div class="format-info" id="video-format-info"></div>
                    </div>
                    <div class="format-group">
                        <h4>Audio Format</h4>
                        <select id="audio-format"></select>
                        <div class="format-info" id="audio-format-info"></div>
                    </div>
                </div>
                
                <div class="checkbox-group hidden" id="chapters-section">
                    <div class="input-group" style="flex: 1;">
                        <label>Chapters</label>
                        <select id="chapter-select"></select>
                    </div>
                </div>
                
                <div class="checkbox-group hidden" id="subtitles-section">
                    <div class="input-group" style="flex: 1;">
                        <label>Subtitles</label>
                        <select id="subtitle-select"></select>
                    </div>
                </div>
                
                <div class="download-bar">
                    <input type="text" id="save-path" value="/app/downloads" placeholder="Save path" />
                    <button class="btn btn-success" id="download-btn" onclick="startDownload()">Download</button>
                    <button class="btn btn-danger hidden" id="cancel-btn" onclick="cancelDownload()">Cancel</button>
                </div>
                
                <div class="progress-container" id="progress-container">
                    <div class="progress-bar">
                        <div class="progress-fill" id="progress-fill" style="width: 0%"></div>
                    </div>
                    <div class="progress-text">
                        <span id="progress-status">Preparing...</span>
                        <span id="progress-percent">0%</span>
                    </div>
                </div>
            </div>
        </div>
        
        <div id="advanced-tab" class="tab-content">
            <div class="card">
                <div class="advanced-grid">
                    <div class="advanced-section">
                        <h4>Configuration</h4>
                        <div class="input-group">
                            <label>Proxy</label>
                            <input type="text" id="proxy-url" placeholder="http://proxy:port" />
                        </div>
                    </div>
                    <div class="advanced-section">
                        <h4>Embed Options</h4>
                        <div class="checkbox-group" style="flex-direction: column; gap: 8px;">
                            <label class="checkbox-item">
                                <input type="checkbox" id="embed-thumbnail" checked />
                                <span>Embed Thumbnail</span>
                            </label>
                            <label class="checkbox-item">
                                <input type="checkbox" id="embed-chapters" checked />
                                <span>Embed Chapters</span>
                            </label>
                            <label class="checkbox-item">
                                <input type="checkbox" id="embed-subtitles" />
                                <span>Embed Subtitles</span>
                            </label>
                        </div>
                    </div>
                    <div class="advanced-section">
                        <h4>Time Range</h4>
                        <div class="input-group">
                            <label>Start - End (seconds)</label>
                            <input type="text" id="time-range" placeholder="e.g. 0-60" />
                        </div>
                    </div>
                    <div class="advanced-section">
                        <h4>Rate Limit</h4>
                        <div class="input-group">
                            <label>Speed Limit (e.g. 1M, 500K)</label>
                            <input type="text" id="rate-limit" placeholder="No limit" />
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <div id="downloads-tab" class="tab-content">
            <div class="card">
                <h4 style="margin-bottom: 12px; color: #bac2de;">Active Downloads</h4>
                <div id="downloads-list"></div>
            </div>
        </div>
        
        <div id="files-tab" class="tab-content">
            <div class="card">
                <h4 style="margin-bottom: 12px; color: #bac2de;">Downloaded Files</h4>
                <div id="files-list"></div>
            </div>
        </div>
    </div>
    
    <script>
        let currentVideo = null;
        let currentDownloadId = null;
        let videoFormats = [];
        let audioFormats = [];
        
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                tab.classList.add('active');
                document.getElementById(tab.dataset.tab + '-tab').classList.add('active');
                
                if (tab.dataset.tab === 'downloads') loadDownloads();
                if (tab.dataset.tab === 'files') loadFiles();
            });
        });
        
        document.getElementById('url-input').addEventListener('keypress', e => {
            if (e.key === 'Enter') analyzeUrl();
        });
        
        async function analyzeUrl() {
            const url = document.getElementById('url-input').value.trim();
            if (!url) return;
            
            const btn = document.getElementById('analyze-btn');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Analyzing...';
            
            try {
                const res = await fetch('/api/info', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({url})
                });
                const data = await res.json();
                
                if (data.error) {
                    alert('Error: ' + data.error);
                    return;
                }
                
                currentVideo = data;
                showVideoPreview(data);
            } catch (e) {
                alert('Error: ' + e.message);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Analyze';
            }
        }
        
        function showVideoPreview(video) {
            document.getElementById('video-preview-card').classList.remove('hidden');
            
            document.getElementById('video-title').textContent = video.title || 'Unknown';
            
            const thumb = document.getElementById('video-thumbnail');
            const placeholder = document.getElementById('thumbnail-placeholder');
            if (video.thumbnail) {
                thumb.src = video.thumbnail;
                thumb.classList.remove('hidden');
                placeholder.classList.add('hidden');
            } else {
                thumb.classList.add('hidden');
                placeholder.classList.remove('hidden');
            }
            
            const durationEl = document.getElementById('video-duration');
            if (video.duration) {
                const mins = Math.floor(video.duration / 60);
                const secs = video.duration % 60;
                durationEl.textContent = `${mins}:${secs.toString().padStart(2, '0')}`;
                durationEl.classList.remove('hidden');
            } else {
                durationEl.classList.add('hidden');
            }
            
            document.getElementById('live-badge').classList.toggle('hidden', !video.is_live);
            
            document.getElementById('video-desc').textContent = video.description || '';
            
            videoFormats = (video.formats || []).filter(f => f.resolution && !f.resolution.includes('audio'));
            audioFormats = (video.formats || []).filter(f => f.ext === 'm4a' || f.ext === 'mp3' || f.ext === 'webm');
            
            populateFormatSelect('video-format', videoFormats, 'video');
            populateFormatSelect('audio-format', audioFormats, 'audio');
            
            const chaptersSection = document.getElementById('chapters-section');
            if (video.chapters && video.chapters.length > 0) {
                chaptersSection.classList.remove('hidden');
                const select = document.getElementById('chapter-select');
                select.innerHTML = '<option value="">Full Video</option>';
                video.chapters.forEach((ch, i) => {
                    const opt = document.createElement('option');
                    opt.value = i;
                    opt.textContent = ch.title || `Chapter ${i + 1}`;
                    select.appendChild(opt);
                });
            } else {
                chaptersSection.classList.add('hidden');
            }
            
            const subsSection = document.getElementById('subtitles-section');
            if (video.subtitles && Object.keys(video.subtitles).length > 0) {
                subsSection.classList.remove('hidden');
                const select = document.getElementById('subtitle-select');
                select.innerHTML = '';
                Object.keys(video.subtitles).forEach(lang => {
                    const opt = document.createElement('option');
                    opt.value = lang;
                    opt.textContent = lang;
                    select.appendChild(opt);
                });
            } else {
                subsSection.classList.add('hidden');
            }
        }
        
        function populateFormatSelect(selectId, formats, type) {
            const select = document.getElementById(selectId);
            select.innerHTML = '';
            
            if (type === 'video') {
                const presets = [
                    {id: 'best', label: 'Best Quality'},
                    {id: 'bestvideo+bestaudio', label: 'Best Video + Audio'},
                    {id: 'worst', label: 'Lowest Quality'}
                ];
                presets.forEach(p => {
                    const opt = document.createElement('option');
                    opt.value = p.id;
                    opt.textContent = p.label;
                    select.appendChild(opt);
                });
            }
            
            formats.forEach(f => {
                const opt = document.createElement('option');
                opt.value = f.format_id;
                const size = f.filesize ? formatSize(f.filesize) : 'Unknown';
                opt.textContent = `${f.ext} - ${f.resolution || 'audio'} - ${f.fps || ''} ${f.vcodec || ''} (${size})`;
                select.appendChild(opt);
            });
            
            select.addEventListener('change', () => updateFormatInfo(selectId));
            updateFormatInfo(selectId);
        }
        
        function updateFormatInfo(selectId) {
            const select = document.getElementById(selectId);
            const infoEl = document.getElementById(selectId + '-info');
            const value = select.value;
            
            let format = videoFormats.find(f => f.format_id === value) || audioFormats.find(f => f.format_id === value);
            if (!format && value === 'best') format = videoFormats[0];
            if (!format && value === 'bestvideo+bestaudio') format = videoFormats[0];
            
            if (format) {
                infoEl.textContent = `${format.ext} | ${format.resolution || 'audio'} | ${format.vcodec || format.acodec || 'unknown'}`;
            }
        }
        
        async function startDownload() {
            const url = document.getElementById('url-input').value.trim();
            if (!url) return;
            
            const videoFormat = document.getElementById('video-format').value;
            const audioFormat = document.getElementById('audio-format').value;
            
            let formatId = videoFormat;
            if (audioFormat && audioFormat !== videoFormat && !videoFormat.includes('+')) {
                formatId = videoFormat + '+' + audioFormat;
            }
            
            const options = {
                url,
                format_id: formatId,
                save_path: document.getElementById('save-path').value,
                embed_thumbnail: document.getElementById('embed-thumbnail').checked,
                embed_chapters: document.getElementById('embed-chapters').checked,
                embed_subtitles: document.getElementById('embed-subtitles').checked,
                time_range: document.getElementById('time-range').value,
                rate_limit: document.getElementById('rate-limit').value,
                proxy: document.getElementById('proxy-url').value,
                chapter: document.getElementById('chapter-select').value,
                subtitle: document.getElementById('subtitle-select').value,
                download_thumbnail: document.getElementById('download-thumb').checked
            };
            
            try {
                const res = await fetch('/api/download', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(options)
                });
                const data = await res.json();
                
                if (data.error) {
                    alert(data.error);
                    return;
                }
                
                currentDownloadId = data.id;
                showProgress(true);
                pollProgress();
            } catch (e) {
                alert('Error: ' + e.message);
            }
        }
        
        function showProgress(show) {
            document.getElementById('progress-container').classList.toggle('active', show);
            document.getElementById('download-btn').classList.toggle('hidden', show);
            document.getElementById('cancel-btn').classList.toggle('hidden', !show);
        }
        
        async function pollProgress() {
            if (!currentDownloadId) return;
            
            try {
                const res = await fetch('/api/status/' + currentDownloadId);
                const data = await res.json();
                
                document.getElementById('progress-fill').style.width = data.progress + '%';
                document.getElementById('progress-percent').textContent = data.progress + '%';
                document.getElementById('progress-status').textContent = data.status;
                
                if (data.status === 'completed' || data.status === 'failed' || data.status === 'cancelled') {
                    showProgress(false);
                    currentDownloadId = null;
                    loadDownloads();
                } else {
                    setTimeout(pollProgress, 1000);
                }
            } catch (e) {
                console.error(e);
            }
        }
        
        async function cancelDownload() {
            if (!currentDownloadId) return;
            
            await fetch('/api/cancel/' + currentDownloadId, {method: 'POST'});
            showProgress(false);
            currentDownloadId = null;
        }
        
        async function loadDownloads() {
            try {
                const res = await fetch('/api/list');
                const data = await res.json();
                
                const list = document.getElementById('downloads-list');
                if (data.downloads.length === 0) {
                    list.innerHTML = '<p style="color: #6c7086; text-align: center;">No downloads</p>';
                    return;
                }
                
                list.innerHTML = data.downloads.map(d => `
                    <div class="download-item ${d.status}">
                        <div class="download-info">
                            <div class="download-title">${d.title || 'Unknown'}</div>
                            <div class="download-status">
                                <span class="status-badge status-${d.status}">${d.status}</span>
                                ${d.error ? '<span style="color: #f38ba8;"> - ' + d.error + '</span>' : ''}
                            </div>
                        </div>
                        ${d.status === 'downloading' ? '<button class="btn btn-danger btn-sm" onclick="cancelDownloadById(\'' + d.id + '\')">Cancel</button>' : ''}
                        ${(d.status === 'completed' || d.status === 'failed' || d.status === 'cancelled') ? '<button class="btn btn-secondary btn-sm" onclick="deleteDownloadById(\'' + d.id + '\')">Delete</button>' : ''}
                    </div>
                `).join('');
            } catch (e) {
                console.error(e);
            }
        }
        
        async function cancelDownloadById(id) {
            await fetch('/api/cancel/' + id, {method: 'POST'});
            loadDownloads();
        }
        
        async function deleteDownloadById(id) {
            await fetch('/api/delete/' + id, {method: 'DELETE'});
            loadDownloads();
        }
        
        async function loadFiles() {
            try {
                const res = await fetch('/api/files');
                const data = await res.json();
                
                const list = document.getElementById('files-list');
                if (data.files.length === 0) {
                    list.innerHTML = '<p style="color: #6c7086; text-align: center;">No files yet</p>';
                    return;
                }
                
                list.innerHTML = data.files.map(f => `
                    <div class="file-item">
                        <span class="name">${f.name}</span>
                        <span class="size">${formatSize(f.size)}</span>
                        <a href="/api/file/${encodeURIComponent(f.path)}" class="btn btn-primary btn-sm" download>Download</a>
                    </div>
                `).join('');
            } catch (e) {
                console.error(e);
            }
        }
        
        function formatSize(bytes) {
            if (!bytes) return 'Unknown';
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        }
        
        setInterval(() => {
            if (currentDownloadId) pollProgress();
        }, 2000);
    </script>
</body>
</html>
